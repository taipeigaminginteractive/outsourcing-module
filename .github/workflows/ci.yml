name: CI
on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    services: {} # 不用 GitHub services，改用 compose

    steps:
      - uses: actions/checkout@v4

      # ---------- infra ----------
      - name: Start CI services
        run: make ci-services-up

      - name: Wait for database
        run: make ci-wait-db

      # ---------- backend ----------
      - name: Backend setup
        run: make ci-backend-setup

      - name: Backend lint
        run: make ci-backend-lint

      - name: Backend test
        run: make ci-backend-test

      # ---------- frontend ----------
      - name: Frontend setup
        run: make ci-frontend-setup

      - name: Frontend lint
        run: make ci-frontend-lint

      - name: Frontend test
        run: make ci-frontend-test

      # ---------- e2e ----------
      - name: E2E test
        run: make ci-frontend-test-e2e

      # ---------- cleanup ----------
      - name: Cleanup
        if: always()
        run: make ci-services-down