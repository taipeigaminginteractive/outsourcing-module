version: "3.8"

services:
  # PostgreSQL 數據庫
  postgres:
    image: postgres:15-alpine
    container_name: platform_postgres
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - platform_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 緩存和消息代理
  redis:
    image: redis:7-alpine
    container_name: platform_redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - platform_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI 應用程式
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: platform_api
    environment:
      # 數據庫配置
      DATABASE_URL: postgresql://platform_user:platform_password@postgres:5432/platform_db

      # Redis 配置
      REDIS_URL: redis://:redis_password@redis:6379

      # Celery 配置
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_password@redis:6379/1

      # 應用程式配置
      ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: false

      # JWT 配置
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_MINUTES: 43200

      # CORS 配置
      CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'

      # 內部 token
      INTERNAL_TOKEN: your-internal-token-change-in-production

      # 時區
      TZ: Asia/Taipei
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - platform_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: platform_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      # 數據庫配置
      DATABASE_URL: postgresql://platform_user:platform_password@postgres:5432/platform_db

      # Redis 配置
      REDIS_URL: redis://:redis_password@redis:6379

      # Celery 配置
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_password@redis:6379/1
      CELERY_TIMEZONE: Asia/Taipei

      # 應用程式配置
      ENV: production

      # JWT 配置
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ALGORITHM: HS256

      # 內部 token
      INTERNAL_TOKEN: your-internal-token-change-in-production

      # 時區
      TZ: Asia/Taipei
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - platform_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (定時任務調度器)
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: platform_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      # 數據庫配置
      DATABASE_URL: postgresql://platform_user:platform_password@postgres:5432/platform_db

      # Redis 配置
      REDIS_URL: redis://:redis_password@redis:6379

      # Celery 配置
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_password@redis:6379/1
      CELERY_TIMEZONE: Asia/Taipei

      # 應用程式配置
      ENV: production

      # JWT 配置
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ALGORITHM: HS256

      # 內部 token
      INTERNAL_TOKEN: your-internal-token-change-in-production

      # 時區
      TZ: Asia/Taipei
    volumes:
      - ./logs:/app/logs
      - celery_beat_data:/app/celerybeat-schedule
    networks:
      - platform_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Flower (監控工具)
  celery-flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: platform_celery_flower
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      # Celery 配置
      CELERY_BROKER_URL: redis://:redis_password@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redis_password@redis:6379/1
    ports:
      - "5555:5555"
    networks:
      - platform_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Next.js 前端應用
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: platform_frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - platform_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Nginx 反向代理 (可選)
  nginx:
    image: nginx:alpine
    container_name: platform_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - platform_network
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

# 網絡配置
networks:
  platform_network:
    driver: bridge

# 數據卷配置
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local
